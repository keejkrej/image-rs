[package]
name = "image-rs"
version = "0.1.0"
edition = "2024"
license = "BSD-2-Clause"
authors = ["image-rs contributors"]
repository = "https://github.com/keejkrej/image-rs"

[features]
default = []
bioformats = ["dep:bioformats-rs"]
morpholib = ["dep:morpholib-rs"]
thunderstorm = ["dep:thunderstorm-rs"]

[[bin]]
name = "image"
path = "src/main.rs"

[dependencies]
bioformats-rs = { git = "https://github.com/keejkrej/bioformats-rs.git", rev = "c6b6c072831294b2d11e8cc4a7991555a6f7f5ee", optional = true }
clap = { version = "4.5", features = ["derive"] }
gpui = { package = "gpui", git = "https://github.com/gpui-ce/gpui-ce" }
gpui_platform = { git = "https://github.com/gpui-ce/gpui-ce" }
image = "0.25"
morpholib-rs = { git = "https://github.com/keejkrej/morpholib-rs", optional = true }
ndarray = { version = "0.16", features = ["rayon"] }
rayon = "1.11"
rfd = "0.15"
rustfft = "6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
semver = { version = "1.0", features = ["serde"] }
smallvec = "1.15"
thiserror = "2.0"
thunderstorm-rs = { git = "https://github.com/keejkrej/thunderstorm-rs.git", rev = "b796f81", optional = true }
tiff = "0.10"
toml = "0.8"
ureq = "2.12"
wasmparser = { version = "0.244", default-features = false, features = ["std", "validate", "component-model", "features"] }
wasmtime = { version = "47.0.3", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }

[dev-dependencies]
tempfile = "3.14"
wat = "=1.244.0"
wit-bindgen = "0.51"
wit-component = "0.244"
wit-parser = "0.244"
